#:schema node_modules/wrangler/config-schema.json
main = ".open-next/worker.js"
name = "clean-style"
compatibility_date = "2026-03-20"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

[vars]
NEXT_PUBLIC_APP_URL = "https://clean-style.ecomarin.workers.dev"
NEXT_PUBLIC_ENABLE_RESPECT_PILOT = "0"
NEXT_PUBLIC_ENABLE_AI_CHAT = "1"
NEXT_PUBLIC_APP_VARIANT = "default"

[secrets]
required = ["OPENROUTER_API_KEY", "ADMIN_SECRET"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "clean-style-db"
database_id = "50c80b79-0e38-4c8e-8b38-a7652b35114c"
