name: Deploy Clean Style Student

on:
  workflow_dispatch:

concurrency:
  group: deploy-clean-style-student
  cancel-in-progress: true

jobs:
  deploy-student:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WORKER_NAME: clean-style-student
      NEXT_PUBLIC_APP_URL: https://clean-style-student.ecomarin.workers.dev
      NEXT_PUBLIC_ENABLE_RESPECT_PILOT: "0"
      NEXT_PUBLIC_ENABLE_AI_CHAT: "0"
      NEXT_PUBLIC_APP_VARIANT: student
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux-specific binaries
        run: |
          pnpm add -D --ignore-scripts lightningcss-linux-x64-gnu
          pnpm add -D --ignore-scripts @tailwindcss/oxide-linux-x64-gnu

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is missing" && exit 1)

      - name: Build
        run: pnpm run build

      - name: Deploy clean-style-student
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler deploy \
            --name "$WORKER_NAME" \
            --var NEXT_PUBLIC_APP_URL:"$NEXT_PUBLIC_APP_URL" \
            --var NEXT_PUBLIC_ENABLE_RESPECT_PILOT:"$NEXT_PUBLIC_ENABLE_RESPECT_PILOT" \
            --var NEXT_PUBLIC_ENABLE_AI_CHAT:"$NEXT_PUBLIC_ENABLE_AI_CHAT" \
            --var NEXT_PUBLIC_APP_VARIANT:"$NEXT_PUBLIC_APP_VARIANT"

      - name: Smoke test clean-style-student
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.NEXT_PUBLIC_APP_URL;
          let res;

          for (let attempt = 1; attempt <= 10; attempt += 1) {
            res = await fetch(url);
            if (res.ok) break;
            console.log(`clean-style-student smoke attempt ${attempt} got HTTP ${res.status}`);
            await new Promise((resolve) => setTimeout(resolve, 3000));
          }

          if (!res?.ok) {
            throw new Error(`clean-style-student smoke HTTP ${res?.status ?? 'no response'}`);
          }

          const testRes = await fetch(`${url}/test`);
          const testHtml = await testRes.text();
          if (!testRes.ok || !testHtml.includes('학생용 청렴 진단을 준비하고 있어요')) {
            throw new Error('student preparation screen was not found');
          }

          const blockedRoutes = [
            { path: '/api/chat', method: 'POST' },
            { path: '/api/results', method: 'POST' },
            { path: '/api/questions', method: 'GET' },
            { path: '/api/summarize', method: 'POST' },
            { path: '/api/respect-advice', method: 'POST' },
            { path: '/api/admin/dashboard', method: 'HEAD' },
          ];

          for (const route of blockedRoutes) {
            const blockedRes = await fetch(`${url}${route.path}`, {
              method: route.method,
              headers: { 'Content-Type': 'application/json' },
              body: route.method === 'POST' ? JSON.stringify({}) : undefined,
            });
            if (blockedRes.status !== 404) {
              throw new Error(`${route.path} should be disabled, got HTTP ${blockedRes.status}`);
            }
          }

          console.log(`clean-style-student smoke passed: ${url}`);
          NODE
