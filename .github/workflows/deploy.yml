name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_APP_URL: https://clean-style.ecomarin.workers.dev
      NEXT_PUBLIC_ENABLE_RESPECT_PILOT: "1"
      NEXT_PUBLIC_ENABLE_AI_CHAT: "1"
      NEXT_PUBLIC_APP_VARIANT: default
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux-specific binaries
        run: |
          pnpm add -D --ignore-scripts lightningcss-linux-x64-gnu
          pnpm add -D --ignore-scripts @tailwindcss/oxide-linux-x64-gnu

      - name: Validate required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is missing" && exit 1)
          test -n "$OPENAI_API_KEY" || (echo "OPENAI_API_KEY is missing" && exit 1)
          test -n "$ADMIN_SECRET" || (echo "ADMIN_SECRET is missing" && exit 1)

      - name: Build
        run: pnpm run build

      - name: Write Workers secrets file
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          node -e "const fs = require('node:fs'); const required = ['OPENAI_API_KEY', 'ADMIN_SECRET']; const data = Object.fromEntries(required.map((key) => [key, process.env[key] || ''])); fs.writeFileSync('.secrets.json', JSON.stringify(data));"

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler deploy \
            --secrets-file .secrets.json \
            --var NEXT_PUBLIC_APP_URL:"$NEXT_PUBLIC_APP_URL" \
            --var NEXT_PUBLIC_ENABLE_RESPECT_PILOT:"$NEXT_PUBLIC_ENABLE_RESPECT_PILOT" \
            --var NEXT_PUBLIC_ENABLE_AI_CHAT:"$NEXT_PUBLIC_ENABLE_AI_CHAT" \
            --var NEXT_PUBLIC_APP_VARIANT:"$NEXT_PUBLIC_APP_VARIANT"

      - name: Clean Workers secrets file
        if: always()
        run: rm -f .secrets.json

      - name: Smoke test deployed AI chat
        run: |
          node --input-type=module <<'NODE'
          const url = `${process.env.NEXT_PUBLIC_APP_URL}/api/chat`;
          const res = await fetch(url, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-clean-style-client-id': `github-actions-smoke-${Date.now()}`,
            },
            body: JSON.stringify({
              styleKey: 'principle-transparent-independent',
              scores: { principle: 80, transparency: 80, independence: 80 },
              userContext: '출장을 하루면 되는데 2일로 가도 될까?',
            }),
          });

          if (!res.ok || !res.body) {
            throw new Error(`AI smoke HTTP ${res.status}`);
          }

          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';
          const errors = [];
          const started = Date.now();

          async function handlePayload(payload) {
            if (payload === '[DONE]') return false;

            let event;
            try {
              event = JSON.parse(payload);
            } catch {
              return false;
            }

            if (event.error) {
              errors.push(`${event.error}${event.status ? `:${event.status}` : ''}`);
            }
            if (event.token) {
              await reader.cancel();
              console.log(`AI smoke passed in ${Date.now() - started}ms`);
              return true;
            }
            return false;
          }

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() ?? '';

            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed.startsWith('data: ')) continue;
              const payload = trimmed.slice(6);
              if (await handlePayload(payload)) {
                process.exit(0);
              }
            }
          }

          const leftover = buffer.trim();
          if (leftover.startsWith('data: ')) {
            const payload = leftover.slice(6);
            if (await handlePayload(payload)) {
              process.exit(0);
            }
          }

          throw new Error(`AI smoke failed: ${errors.join(', ') || 'no token returned'}`);
          NODE

      - name: Smoke test workplace-respect entry
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.NEXT_PUBLIC_APP_URL;
          let homeRes;
          for (let attempt = 1; attempt <= 5; attempt += 1) {
            homeRes = await fetch(base);
            if (homeRes.ok) break;
            await new Promise((resolve) => setTimeout(resolve, 3000));
          }
          if (!homeRes?.ok) throw new Error(`home HTTP ${homeRes?.status ?? 'no response'}`);
          // /respect/check는 기능이 꺼져도 안내 화면으로 200을 주므로, 홈의 아이콘 링크로 켜짐을 확인한다.
          const home = await homeRes.text();
          for (const entry of ['action', 'experience']) {
            if (!home.includes(`/respect/check?entry=${entry}`)) {
              throw new Error(`home is missing the ${entry} workplace-respect icon`);
            }
            const res = await fetch(`${base}/respect/check?entry=${entry}`);
            if (!res.ok) throw new Error(`/respect/check?entry=${entry} HTTP ${res.status}`);
          }
          console.log('workplace-respect smoke passed');
          NODE
